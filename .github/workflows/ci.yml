name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - ts-port

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate API client
        run: npm run generate

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
