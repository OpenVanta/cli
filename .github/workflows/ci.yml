name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - ts-port

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn

      - name: Install Yarn
        run: npm install -g yarn@1.22.22

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Generate API client
        run: yarn generate

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test
