version: 2

project_name: vanta

before:
  hooks:
    - go generate ./internal/vantaapi

builds:
  - id: vanta
    main: ./main.go
    binary: vanta
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/VantaInc/cli/cmd.Version={{.Version}}
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64

  - id: darwin-amd64
    main: ./main.go
    binary: vanta
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/VantaInc/cli/cmd.Version={{.Version}}
    goos:
      - darwin
    goarch:
      - amd64

  - id: darwin-arm64
    main: ./main.go
    binary: vanta
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/VantaInc/cli/cmd.Version={{.Version}}
    goos:
      - darwin
    goarch:
      - arm64

archives:
  - id: binaries
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

notarize:
  macos:
    - enabled: '{{ and (isEnvSet "MACOS_SIGN_P12") (isEnvSet "MACOS_SIGN_PASSWORD") (isEnvSet "MACOS_NOTARY_ISSUER_ID") (isEnvSet "MACOS_NOTARY_KEY_ID") (isEnvSet "MACOS_NOTARY_KEY") }}'
      ids:
        - darwin-amd64
        - darwin-arm64
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m
